<main class="mfe-shell">
  <h1>Angular 20 single-spa host</h1>
  <nav class="mfe-nav" aria-label="Applications">
    <a data-mfe-link href="/">Dashboard</a>
    <a data-mfe-link href="/angular">Angular books</a>
    <a data-mfe-link href="/react">React to-do list</a>
    <a data-mfe-link href="/svelte">Svelte goals</a>
  </nav>
  <p id="mfe-not-found" hidden>Page not found. Use the navigation above.</p>
  <div class="mfe-apps">
    @for (name of ['books', 'todos', 'goals']; track name) {
      <section class="mfe-app" [attr.data-mfe]="name">
        <div class="mfe-error" [id]="'mfe-error-' + name" role="alert" hidden>
          <span></span> <button type="button" data-mfe-reload>Reload</button>
        </div>
        <div [id]="'mfe-' + name"></div>
      </section>
    }
  </div>
</main>
